spring:
  application:
    name: batch-service

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  batch:
    job:
      # non esegue automaticamente il job all'avvio: viene lanciato via REST
      enabled: false
    jdbc:
      # crea automaticamente le tabelle interne di Spring Batch (BATCH_JOB_INSTANCE, ecc.)
      initialize-schema: always

server:
  port: 8080

# percorso del file da importare (puo' essere sovrascritto, es. file:/percorso/esterno.csv)
batch:
  input:
    file: classpath:data/prodotti.csv

logging:
  level:
    com.example.batchservice: DEBUG
